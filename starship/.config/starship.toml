"$schema" = 'https://starship.rs/config-schema.json'

# One line, uniform background, no dividers: segments are told apart by color and
# separated by a single space. Each segment pads on the LEFT only, so concatenating them
# never doubles the gap; one explicit trailing space closes the bar before the taper.
#
# Colors are ANSI names and indices, never hex, so the prompt follows Ghostty's theme --
# there is no [palettes] block on purpose.

format = """\
$aws\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$character\
[](fg:18) \
"""

add_newline = false

[line_break]
disabled = true

[aws]
format = '[ ( $profile)( \($region\))](bg:18 fg:bright-red)'

[directory]
format = '[  $path$read_only](bg:18 fg:bright-blue)'
read_only = " "
read_only_style = 'bg:18 fg:bright-red'

[git_branch]
format = '[  $branch(:$remote_branch)](bg:18 fg:bright-green)'

[git_commit]
format = '[ $hash$tag](bg:18 fg:white)'
tag_symbol = '  '
tag_disabled = false

[git_state]
format = '[ \($state( $progress_current/$progress_total)\)](bg:18 fg:bright-red)'

# Parenthesised because git_status stays "present" with empty content on a clean tree
#
# Glyphs here must stay out of U+F500-U+F6FF: fish reserves that range internally, measures
# anything in it as 3 columns, and leaves the cursor stranded that far past the prompt.
[git_status]
format = '([ $all_status$ahead_behind](bg:18 fg:bright-yellow))'

conflicted = "\uF40C$count"                        # oct-alert_fill
ahead = "\uF431$count"                             # oct-arrow_up
behind = "\uF433$count"                            # oct-arrow_down
diverged = "\uF431$ahead_count\uF433$behind_count" # up and down arrows
untracked = "\U000F04CE$count"                     # md-star
stashed = "\U000F0193$count"                       # md-content_save (floppy disk)
modified = "\uF040$count"                          # fa-pencil
staged = "+$count"
renamed = "»$count"
deleted = "\U000F1398$count"                       # md-close_thick

# Default format is "$symbol " -- that trailing space falls outside the styled span
[character]
format = '$symbol'
success_symbol = '[ ❯](bg:18 fg:bright-green)'
error_symbol = '[ ❯](bg:18 fg:bright-red)'
vimcmd_symbol = '[ ❮](bg:18 fg:bright-yellow)'
vimcmd_replace_symbol = "[ \U000F040A](bg:18 fg:bright-yellow)"     # md-play
vimcmd_replace_one_symbol = "[ \U000F040A](bg:18 fg:bright-yellow)" # md-play
vimcmd_visual_symbol = '[ V](bg:18 fg:bright-purple)'
