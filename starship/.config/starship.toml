"$schema" = 'https://starship.rs/config-schema.json'

# One line, uniform dark2 background, no dividers: segments are told apart by colour and
# separated by a single space. Each segment pads on the LEFT only, so concatenating them
# never doubles the gap; one explicit trailing space closes the bar before the taper.

format = """\
$aws\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$character\
[](fg:dark2) \
"""

add_newline = false
palette = "gruvbox_dark_hard"

[line_break]
disabled = true

[aws]
format = '[ ( $profile)( \($region\))](bg:dark2 fg:bright_orange)'

[directory]
format = '[  $path$read_only](bg:dark2 fg:bright_blue)'
read_only = " "
read_only_style = 'bg:dark2 fg:bright_red'

[git_branch]
format = '[  $branch(:$remote_branch)](bg:dark2 fg:bright_green)'

[git_commit]
format = '[ $hash$tag](bg:dark2 fg:light4)'
tag_symbol = '  '
tag_disabled = false

[git_state]
format = '[ \($state( $progress_current/$progress_total)\)](bg:dark2 fg:bright_red)'

# Parenthesised because git_status stays "present" with empty content on a clean tree
[git_status]
format = '([ $all_status$ahead_behind](bg:dark2 fg:bright_yellow))'
conflicted = "~$count"
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇡$ahead_count⇣$behind_count"
untracked = "?$count"
stashed = "*$count"
modified = "!$count"
staged = "+$count"
renamed = "»$count"
deleted = "✘$count"

# Default format is "$symbol " -- that trailing space falls outside the styled span
[character]
format = '$symbol'
success_symbol = '[ ❯](bg:dark2 fg:bright_green)'
error_symbol = '[ ❯](bg:dark2 fg:bright_red)'
vicmd_symbol = '[ ❮](bg:dark2 fg:bright_yellow)'
vimcmd_replace_symbol = '[ ▶](bg:dark2 fg:bright_yellow)'
vimcmd_replace_one_symbol = '[ ▶](bg:dark2 fg:bright_yellow)'
vimcmd_visual_symbol = '[ V](bg:dark2 fg:bright_orange)'

