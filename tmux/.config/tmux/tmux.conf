# --- prefix -----------------------------------------------------------------
# C-Space, because fish's emacs bindings own C-b (backward-char) and C-a
# (beginning-of-line). C-Space costs only fish's "insert a space without
# expanding an abbreviation".
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- general ----------------------------------------------------------------
set -g mouse on
set -g history-limit 50000        # Claude Code output is long
set -g focus-events on            # forward focus in/out, so vim can autoread
set -g base-index 1               # windows start at 1, under the number keys
setw -g pane-base-index 1
set -g renumber-windows on        # closing a window closes the gap it leaves
setw -g mode-keys vi              # tmux derives both from $VISUAL/$EDITOR, which
set -g status-keys vi             # now say vim; explicit so it holds either way
set -g automatic-rename off       # workmux names windows, and does it better

# --- terminal ---------------------------------------------------------------
# Claude Code needs both: extended-keys so Shift+Enter is distinguishable from
# Enter, passthrough so its notifications reach Ghostty. `all` rather than `on`
# so a background pane can still notify. Ghostty's terminfo declares Tc, so
# truecolor needs no help; extkeys it does not declare, so that one is ours.
set -s extended-keys on
set -as terminal-features "xterm*:extkeys"
set -g allow-passthrough all

# --- windows ----------------------------------------------------------------
# Browser habit: Opt+Cmd+Arrow. tmux cannot see Command at all, so Ghostty
# translates the chord to CSI 1;6C/D — i.e. Ctrl+Shift+Arrow, which fish leaves
# alone. Alt+Arrow would have been the obvious choice and is wrong: fish uses it
# for prevd/nextd and token motion.
bind -n C-S-Right next-window
bind -n C-S-Left  previous-window

# Stock parks last-window on `l`, which the pane bindings below take.
bind Tab last-window

# Stock starts new windows in the session's directory, not the current pane's.
bind c new-window -c "#{pane_current_path}"

# Move the window itself, rather than moving between windows. -d keeps you on
# the window you are dragging. Also available from the stock `prefix <` menu.
bind -r S-Left  swap-window -d -t -1
bind -r S-Right swap-window -d -t +1

# --- workmux ----------------------------------------------------------------
# Cmd+E, which Ghostty translates to CSI 101;6u (Ctrl+Shift+E)
bind -n C-S-e display-popup -h 80% -w 80% -E "workmux dashboard"

# --- panes ------------------------------------------------------------------
# | and - are mnemonic where stock % and " are not, and these inherit the
# current pane's directory — stock splits open in the session's directory, which
# is the wrong worktree. \\ and _ are the shifted partners and split before the
# current pane rather than after. The doubled backslash is required: a lone one
# escapes the following space and the binding is silently dropped.
bind |  split-window -h  -c "#{pane_current_path}"
bind -  split-window -v  -c "#{pane_current_path}"
bind \\ split-window -hb -c "#{pane_current_path}"
bind _  split-window -vb -c "#{pane_current_path}"

# vim directions, alongside stock's prefix arrows. No -r here: l is a letter you
# type, and a 500ms repeat window would swallow it.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# -r: prefix once, then hold shift and keep nudging.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- clipboard --------------------------------------------------------------
# `on` rather than stock `external` so programs inside a pane — neovim, or
# anything over ssh — can reach the system clipboard via OSC 52. Ghostty's
# terminfo has Ms, so no pbcopy pipe is needed, and unlike pbcopy OSC 52 puts
# the text on *this* machine's clipboard rather than the remote one.
set -g set-clipboard on

# Stock copy-mode-vi has no y at all; selection is Space and copy is Enter.
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# --- pane borders -----------------------------------------------------------
# Palette names, not hex, so the chrome follows Ghostty's theme. brightblue
# rather than blue: in Gruvbox, blue (#458588) is darker than brightblack
# (#928374), so it would read dimmer than the inactive borders. Nothing uses
# black — it is exactly the pane background.
set -g pane-border-lines heavy
set -g pane-border-indicators both    # the `colour` half only applies at 2 panes
set -g pane-border-style fg=brightblack

# Yellow in copy mode, red when panes are synchronised.
set -g pane-active-border-style \
  "#{?pane_in_mode,fg=brightyellow,#{?synchronize-panes,fg=brightred,fg=brightblue}}"

# Title rail along the top of each pane. Claude Code puts its task summary in
# pane_title; the shell prompt puts repo:branch.
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[reverse],}#{pane_index}#[default] #{pane_title} "

# --- status bar -------------------------------------------------------------
# bg=default rather than a band: black is exactly the pane background, and the
# pane border rail directly below already separates the bar from the panes.
set -g status-position top
set -g status-style "bg=default,fg=white"
set -g status-left \
  "#[fg=black,bg=brightblue,bold] #S #{?client_prefix,#[fg=black#,bg=brightyellow] PREFIX ,}#[default] "
set -g status-left-length 40      # stock 10 truncates the block above
set -g status-right ""            # stock puts the pane title and date here

# workmux prefixes window names with a space for an icon slot. Flags are worth
# keeping — Z means a pane is zoomed, which is otherwise invisible.
setw -g window-status-format " #I:#{s/^ //:window_name}#{?window_flags,#{window_flags},} "
setw -g window-status-current-format " #I:#{s/^ //:window_name}#{?window_flags,#{window_flags},} "
setw -g window-status-style fg=brightblack
setw -g window-status-current-style fg=brightwhite,bold

# --- machine-local overrides ------------------------------------------------
source-file -q ~/.config/tmux/tmux.conf.local
